    rel="stylesheet"
    th:if="${pluginFinder.available('PluginMoments')}"
    data-swup-conditional="moments"
    th:href="@{/assets/dist/moments.css?v=20261102}"
  />
  <script
    type="module"
    th:if="${pluginFinder.available('PluginMoments')}"
    data-swup-conditional="moments"
    th:src="@{/assets/dist/moments.js?v=20261102}"
  ></script>
</th:block>
