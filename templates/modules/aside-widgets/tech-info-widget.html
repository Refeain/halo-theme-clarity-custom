<section th:fragment="tech-info-widget" class="widget">
  <hgroup class="widget-title text-creative">技术信息</hgroup>
  <div class="widget-body widget-card">
    <dl class="dl-group medium">
      <div>
        <dt>构建平台</dt>
        <dd class="tech-info-row">
          <img th:src="${#strings.isEmpty(theme.config.aside.basic.tech_platform_icon) ? '/themes/theme-clarity/assets/images/logo.png' : theme.config.aside.basic.tech_platform_icon}" alt="" /><span th:text="${theme.config.aside.basic.tech_platform}">Halo</span>
        </dd>
      </div>
      <div>
        <dt>图片存储</dt>
        <dd class="tech-info-row">
          <img th:if="${not #strings.isEmpty(theme.config.aside.basic.image_hosting_icon)}" th:src="${theme.config.aside.basic.image_hosting_icon}" alt="" /><span th:text="${theme.config.aside.basic.image_hosting}">本地存储</span>
        </dd>
      </div>
      <div>
        <dt>软件协议</dt>
        <dd class="tech-info-row">
          <img th:if="${not #strings.isEmpty(theme.config.aside.basic.tech_protocol_icon)}" th:src="${theme.config.aside.basic.tech_protocol_icon}" alt="" /><span th:text="${theme.config.aside.basic.tech_protocol}">GPL-3.0</span>
        </dd>
      </div>
      <div>
        <dt>文章许可</dt>
        <dd class="tech-info-row">
          <img th:if="${not #strings.isEmpty(theme.config.aside.basic.license_icon)}" th:src="${theme.config.aside.basic.license_icon}" alt="" /><a
            th:href="${theme.config.aside.basic.license_url}"
            th:text="${theme.config.aside.basic.license}"
            target="_blank"
            rel="noopener noreferrer"
            >CC BY-NC-SA 4.0</a
          >
        </dd>
      </div>
    </dl>
  </div>
</section>
